<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard from the Semester</title>
<style>
:root{--paper:#FBF4E4;--ink:#2B2A33;--teal:#0E6F75;--tealdk:#094C51;--coral:#E85D4A;--mustard:#F2B134;--line:#E3D6B1;--card:#FFFDF6;--serif:Georgia,'Times New Roman',serif;--sans:Calibri,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.55;color:var(--ink);background:var(--paper)}
header{padding:22px 20px 6px;max-width:960px;margin:0 auto}
header h1{font-family:var(--serif);font-size:34px;line-height:1.1;margin:0;color:var(--tealdk)}
header p{margin:6px 0 0;color:#5b5a63}
#dots{display:flex;gap:6px;max-width:960px;margin:14px auto 0;padding:0 20px}
#dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}#dots i.on{background:var(--coral)}#dots i.cur{background:var(--teal)}
main{max-width:960px;margin:0 auto;padding:14px 20px 70px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:22px 24px}
h2{font-family:var(--serif);font-size:26px;margin:0 0 4px;color:var(--tealdk)}
p{margin:.5em 0;max-width:68ch}.muted{color:#6a6972;font-size:15px}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:14px 0}
.sc{border:3px solid transparent;border-radius:12px;background:#fff;padding:0;cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sc canvas{display:block;width:100%;height:auto}.sc span{display:block;padding:7px 10px;font-weight:bold;color:var(--tealdk)}
.sc[aria-pressed=true]{border-color:var(--coral);box-shadow:0 0 0 3px var(--mustard)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{font:inherit;font-size:15.5px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal)}.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.cor[aria-pressed=true]{background:var(--coral);border-color:var(--coral)}
label.q{display:block;font-weight:bold;margin:14px 0 4px;color:var(--tealdk)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--mustard);border-color:var(--teal)}
.count{font-size:13.5px;color:#6a6972;text-align:right}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
button.b{font:inherit;font-weight:bold;border-radius:10px;padding:10px 22px;border:2px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.b.alt{background:#fff;color:var(--teal)}button.b.ghost{background:none;border-color:var(--line);color:var(--ink);font-weight:normal}button.b.coral{background:var(--coral);border-color:var(--coral)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:15px;color:#6a6972;margin:2px 0 6px}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin:16px 0}
.pcs canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff}
details{margin:12px 0}summary{cursor:pointer;color:var(--teal);font-weight:bold}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tealdk);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
@media (max-width:520px){.pcs{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>

/* ====== postcard drawing ====== */
function wrap(c,text,maxW){var words=String(text).split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines;}
function front(c,S){var sc=byId(SCENES,S.scene),tp=topic(S.top);c.save();c.fillStyle='#fff';c.fillRect(0,0,1500,1000);c.beginPath();c.rect(26,26,1448,948);c.clip();c.translate(26,26);c.scale(1448/1500,948/1000);DRAW[S.scene](c);c.restore();
  c.save();c.translate(70,70);c.rotate(-.025);c.font='italic 52px Georgia,serif';c.lineJoin='round';c.strokeStyle='rgba(9,76,81,.9)';c.lineWidth=9;c.fillStyle='#fff';c.strokeText('Greetings from',0,50);c.fillText('Greetings from',0,50);
  c.font='bold 128px Georgia,serif';c.lineWidth=14;var t=sc.place.charAt(0).toUpperCase()+sc.place.slice(1);if(c.measureText(t+'!').width>1250)c.font='bold 100px Georgia,serif';c.strokeText(t+'!',0,170);c.fillText(t+'!',0,170);c.restore();
  var cap=tp?tp.tag:'';c.font='italic 40px Georgia,serif';var lines=wrap(c,cap,1200),bh=lines.length*52+36,by=950-bh;c.fillStyle='rgba(9,40,44,.78)';rr(c,70,by,1360,bh,18);c.fill();c.fillStyle='#fff';c.textAlign='left';lines.forEach(function(l,i){c.fillText(l,98,by+56+i*52);});}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function back(c,S){var rec=byId(RECIPIENTS,S.rec)||RECIPIENTS[0],sc=byId(SCENES,S.scene),top=topic(S.top),sur=topic(S.sur),name=(S.name||'').trim();
  c.fillStyle='#FBF3DD';c.fillRect(0,0,1500,1000);c.strokeStyle='#D9CBA5';c.lineWidth=3;c.strokeRect(24,24,1452,952);c.strokeStyle='#CBB98C';c.beginPath();c.moveTo(860,80);c.lineTo(860,920);c.stroke();
  c.fillStyle='#2B2A33';c.textAlign='left';c.font='italic 52px Georgia,serif';c.fillText(rec.dear,76,128);
  c.font='italic 36px Georgia,serif';var lines=wrap(c,S.msg||'',690).slice(0,8);c.strokeStyle='#E3D6B1';c.lineWidth=2;for(var i=0;i<8;i++){c.beginPath();c.moveTo(76,196+i*50+10);c.lineTo(800,196+i*50+10);c.stroke();}
  c.fillStyle='#2B2A33';lines.forEach(function(l,i){c.fillText(l,76,196+i*50);});
  c.font='italic 38px Georgia,serif';c.textAlign='right';c.fillText('\u2014 '+(name||'Me'),800,196+8*50+22);c.textAlign='left';
  c.font='bold 25px Calibri,Arial,sans-serif';c.fillStyle='#094C51';c.fillText('The idea I am keeping:',76,700);c.font='27px Calibri,Arial,sans-serif';c.fillStyle='#2B2A33';var tn=top?(top.short||top.name):'';var tl=wrap(c,tn,720).slice(0,2);tl.forEach(function(l,i){c.fillText(l,76,733+i*32);});
  var y2=733+tl.length*32+34;c.font='bold 25px Calibri,Arial,sans-serif';c.fillStyle='#E85D4A';c.fillText('What surprised me most:',76,y2);c.font='27px Calibri,Arial,sans-serif';c.fillStyle='#2B2A33';wrap(c,sur?(sur.short||sur.name):'',720).slice(0,2).forEach(function(l,i){c.fillText(l,76,y2+33+i*32);});
  c.font='bold 25px Calibri,Arial,sans-serif';c.fillStyle='#094C51';c.fillText('Tiny pledges:',910,790);c.font='24px Calibri,Arial,sans-serif';c.fillStyle='#2B2A33';var py=824;(S.pledges||[]).forEach(function(p){var ls=wrap(c,'\u2022 '+p,500);ls.slice(0,3).forEach(function(l,i){c.fillText(i?'   '+l:l,910,py);py+=29;});py+=8;});
  /* stamp */
  var sx=1230,sy=70,sw=190,sh=230;c.fillStyle=sc.stamp;c.fillRect(sx,sy,sw,sh);c.fillStyle='#FBF3DD';for(var k=0;k<=sw;k+=19){c.beginPath();c.arc(sx+k,sy,7,0,7);c.arc(sx+k,sy+sh,7,0,7);c.fill();}for(var m=0;m<=sh;m+=19){c.beginPath();c.arc(sx,sy+m,7,0,7);c.arc(sx+sw,sy+m,7,0,7);c.fill();}
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(sx+14,sy+14,sw-28,sh-28);c.fillStyle='#fff';c.beginPath();c.moveTo(sx+95,sy+176);c.quadraticCurveTo(sx+30,sy+130,sx+60,sy+60);c.quadraticCurveTo(sx+140,sy+60,sx+95,sy+176);c.fill();c.strokeStyle=sc.stamp;c.lineWidth=5;c.beginPath();c.moveTo(sx+95,sy+176);c.lineTo(sx+78,sy+86);c.stroke();c.fillStyle='#fff';c.font='bold 21px Calibri,Arial,sans-serif';c.textAlign='center';c.fillText('ONE PLANET',sx+95,sy+208);c.textAlign='left';
  /* postmark */
  var d=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}).toUpperCase();c.strokeStyle='rgba(60,50,40,.7)';c.fillStyle='rgba(60,50,40,.8)';c.lineWidth=4;c.beginPath();c.arc(1120,200,86,0,7);c.stroke();c.lineWidth=2;c.beginPath();c.arc(1120,200,72,0,7);c.stroke();c.textAlign='center';c.font='bold 20px Calibri,Arial,sans-serif';c.fillText('SEMESTER\u2019S',1120,184);c.fillText('END',1120,208);c.font='bold 17px Calibri,Arial,sans-serif';c.fillText(d,1120,236);c.textAlign='left';
  c.lineWidth=3;c.globalAlpha=.32;for(var w=0;w<4;w++){c.beginPath();c.moveTo(1200,130+w*26);for(var xx=1200;xx<=1440;xx+=20)c.lineTo(xx,130+w*26+(Math.floor((xx-1200)/20)%2?9:-9));c.stroke();}c.globalAlpha=1;
  /* address */
  c.strokeStyle='#CBB98C';c.lineWidth=3;[560,640,720].forEach(function(y){c.beginPath();c.moveTo(910,y);c.lineTo(1430,y);c.stroke();});
  c.fillStyle='#2B2A33';c.font='italic 40px Georgia,serif';wrap(c,'To: '+rec.to,500).slice(0,2).forEach(function(l,i){c.fillText(l,916,548+i*0);});
  c.font='italic 38px Georgia,serif';c.fillStyle='#2B2A33';c.fillText('From: '+(name||'a curious mind'),916,628);c.font='italic 30px Georgia,serif';c.fillStyle='#7C6F55';c.fillText('Delivered with care',916,708);}
function draw(canvas,fn,S,w,h){canvas.width=w;canvas.height=h;var c=canvas.getContext('2d');c.save();c.scale(w/1500,h/1000);fn(c,S);c.restore();}

/* ====== app ====== */
var S={step:0,scene:null,top:null,sur:null,msg:'',pledges:[],rec:null,name:''};
var STEPS=['Start','Scene','Topics','Message','Pledges','Address','Postcard'],main=document.getElementById('main');
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none';},2400);}
function dots(){$('dots').innerHTML=STEPS.map(function(x,i){return '<i class="'+(i<S.step?'on':i===S.step?'cur':'')+'"></i>';}).join('');}
function ok(){var s=S.step;if(s===1)return !!S.scene;if(s===2)return !!S.top&&!!S.sur;if(s===3){var m=S.msg;STARTERS.forEach(function(t){m=m.split(t.replace('\u2026','')).join('');});return m.trim().length>=12;}if(s===4)return S.pledges.length>=1;if(s===5)return !!S.rec;return true;}
function nav(back,next,nextLabel){return '<div class="btns"><button type="button" class="b alt" id="bk"'+(back?'':' disabled')+'>Back</button><button type="button" class="b" id="nx"'+(next?'':' disabled')+'>'+(nextLabel||'Next')+'</button></div>';}
function render(){dots();window.scrollTo(0,0);var s=S.step;if(s===0)r0();else if(s===1)r1();else if(s===2)r2();else if(s===3)r3();else if(s===4)r4();else if(s===5)r5();else r6();
  if($('bk'))$('bk').onclick=function(){S.step--;render();};if($('nx'))$('nx').onclick=function(){if(ok()){S.step++;render();}};}
function r0(){main.innerHTML='<div class="card"><h2>You made it to the end of the semester.</h2><p>Before you go, make a postcard from everything you learned. Pick a scene, choose the topics that stuck with you, write a few words, and make a couple of tiny pledges. At the end you can download your postcard and keep it.</p><p class="muted">It takes about five minutes. Nothing here is graded, and nothing is saved or sent anywhere. Your postcard exists only on your screen and in the file you download.</p><div class="btns"><button type="button" class="b coral" id="nx">Let’s make a postcard</button></div></div>';}
function r1(){main.innerHTML='<div class="card"><h2>Pick the front of your postcard</h2><p>Which place feels like your semester?</p><div class="scenes" role="group" aria-label="Scenes">'+SCENES.map(function(s){return '<button type="button" class="sc" data-id="'+s.id+'" aria-pressed="'+(S.scene===s.id)+'"><canvas width="500" height="333" aria-hidden="true"></canvas><span>'+s.name+'</span></button>';}).join('')+'</div>'+nav(true,ok())+'</div>';
  Array.prototype.forEach.call(main.querySelectorAll('.sc'),function(b){var cv=b.querySelector('canvas'),c=cv.getContext('2d');c.save();c.scale(500/1500,333/1000);DRAW[b.dataset.id](c);c.restore();b.onclick=function(){S.scene=b.dataset.id;Array.prototype.forEach.call(main.querySelectorAll('.sc'),function(x){x.setAttribute('aria-pressed',x===b);});$('nx').disabled=false;};});}
function chipsHTML(sel,cls){return '<div class="chips" role="group">'+TOPICS.map(function(t){return '<button type="button" class="chip '+cls+'" data-id="'+t.id+'" aria-pressed="'+(sel===t.id)+'">'+esc(t.name)+'</button>';}).join('')+'</div>';}
function r2(){main.innerHTML='<div class="card"><h2>What stuck with you?</h2><p>Choose one topic for each question. They can be the same.</p><label class="q">Which topic stuck with you the most?</label>'+chipsHTML(S.top,'')+'<label class="q">Which topic surprised you the most?</label>'+chipsHTML(S.sur,'cor')+nav(true,ok())+'</div>';
  var groups=main.querySelectorAll('.chips');[['top',groups[0]],['sur',groups[1]]].forEach(function(g){Array.prototype.forEach.call(g[1].querySelectorAll('.chip'),function(b){b.onclick=function(){S[g[0]]=b.dataset.id;Array.prototype.forEach.call(g[1].querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===b);});$('nx').disabled=!ok();};});});}
function r3(){main.innerHTML='<div class="card"><h2>Write your message</h2><p>A few honest words, in your own voice. It will be handwritten-style on the back of your postcard.</p><div class="hint">Need a way in? Tap a starter, then keep going.</div><div class="starters">'+STARTERS.map(function(t,i){return '<button type="button" class="chip" data-i="'+i+'">'+esc(t)+'</button>';}).join('')+'</div><label class="q" for="msg">Your message</label><textarea id="msg" maxlength="220" placeholder="Write 1 or 2 sentences…">'+esc(S.msg)+'</textarea><div class="count" id="cnt"></div>'+nav(true,ok())+'</div>';
  var ta=$('msg');function upd(){S.msg=ta.value;$('cnt').textContent=ta.value.length+' / 220';$('nx').disabled=!ok();}upd();ta.addEventListener('input',upd);
  Array.prototype.forEach.call(main.querySelectorAll('.starters .chip'),function(b){b.onclick=function(){var t=STARTERS[+b.dataset.i];ta.value=(ta.value?ta.value.replace(/\s*$/,' '):'')+t.replace('…','')+' ';ta.focus();upd();};});}
function r4(){main.innerHTML='<div class="card"><h2>Make a tiny pledge or two</h2><p>Small things are easier to keep. Pick one or two that you could really do.</p><div class="chips" id="pl" role="group">'+PLEDGES.map(function(p,i){return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="'+(S.pledges.indexOf(p)>-1)+'">'+esc(p)+'</button>';}).join('')+'</div><div class="hint" id="plh"></div>'+nav(true,ok())+'</div>';
  function note(){$('plh').textContent=S.pledges.length+' of 2 chosen';}note();
  Array.prototype.forEach.call(main.querySelectorAll('#pl .chip'),function(b){b.onclick=function(){var p=PLEDGES[+b.dataset.i],ix=S.pledges.indexOf(p);if(ix>-1){S.pledges.splice(ix,1);}else{if(S.pledges.length>=2){toast('Two is plenty. Unselect one to switch.');return;}S.pledges.push(p);}b.setAttribute('aria-pressed',S.pledges.indexOf(p)>-1);note();$('nx').disabled=!ok();};});}
function r5(){main.innerHTML='<div class="card"><h2>Address your postcard</h2><p>Who is this one for?</p><div class="chips" id="rc" role="group">'+RECIPIENTS.map(function(r){return '<button type="button" class="chip" data-id="'+r.id+'" aria-pressed="'+(S.rec===r.id)+'">'+esc(r.to)+'</button>';}).join('')+'</div><label class="q" for="nm">Sign it with (optional): a first name or a nickname</label><input type="text" id="nm" maxlength="24" value="'+esc(S.name)+'" autocomplete="off" placeholder="Leave blank to sign as “Me”">'+nav(true,ok(),'Make my postcard')+'</div>';
  $('nm').addEventListener('input',function(){S.name=this.value;});
  Array.prototype.forEach.call(main.querySelectorAll('#rc .chip'),function(b){b.onclick=function(){S.rec=b.dataset.id;Array.prototype.forEach.call(main.querySelectorAll('#rc .chip'),function(x){x.setAttribute('aria-pressed',x===b);});$('nx').disabled=false;};});}
function r6(){var rec=byId(RECIPIENTS,S.rec),text=rec.dear+'\n'+S.msg+'\n\u2014 '+(S.name.trim()||'Me')+'\n\nThe idea I am keeping: '+topic(S.top).name+'\nWhat surprised me most: '+topic(S.sur).name+'\nTiny pledges: '+S.pledges.join(' / ');
  main.innerHTML='<div class="card"><h2>Your postcard is ready</h2><p>Front and back, made by you. Download it, keep it, or share it if you want to.</p><div class="pcs"><canvas id="cf" role="img" aria-label="Front of your postcard"></canvas><canvas id="cb" role="img" aria-label="Back of your postcard"></canvas></div><div class="btns"><button type="button" class="b coral" id="dl">Download my postcard (PNG)</button><button type="button" class="b alt" id="ch">Make changes</button><button type="button" class="b ghost" id="rs">Start over</button></div><details><summary>Read the text of your postcard</summary><p style="white-space:pre-wrap">'+esc(text)+'</p></details></div>';
  draw($('cf'),front,S,1500,1000);draw($('cb'),back,S,1500,1000);
  $('cf').setAttribute('aria-label','Front of your postcard: Greetings from '+byId(SCENES,S.scene).place+'. '+topic(S.top).tag);$('cb').setAttribute('aria-label','Back of your postcard. '+text.replace(/\n+/g,' '));
  $('dl').onclick=function(){var o=document.createElement('canvas');o.width=1500;o.height=2040;var c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,1500,2040);c.drawImage($('cf'),0,0);c.drawImage($('cb'),0,1040);o.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);var n=(S.name.trim()||'my').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'my';a.download=n+'-semester-postcard.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast('Postcard downloaded.');},'image/png');};
  $('ch').onclick=function(){S.step=1;render();};$('rs').onclick=function(){var z=$('dl').parentNode;z.innerHTML='<span style="font-weight:bold">Start over? Your postcard will be cleared.</span><button type="button" class="b coral" id="yes">Yes, start over</button><button type="button" class="b alt" id="no">Keep my postcard</button>';$('yes').onclick=function(){S={step:0,scene:null,top:null,sur:null,msg:'',pledges:[],rec:null,name:''};render();};$('no').onclick=function(){render();};$('no').focus();};}
render();

})();
</script>
</body>
</html>
